<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Hand-off URLs carry ?sso= / ?token=; never send them on in a Referer. -->
    <meta name="referrer" content="strict-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Volt</title>
    <meta name="theme-color" content="#0e151c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hotel" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-apple-touch-icon.png" />
    <!-- The loading screen's photo frame paints with the page, before any script runs.
         LoadingView draws the same frame in the same place once React mounts. -->
    <style>
        html, body { margin: 0; background: #0e151c; }
        .boot-loading-screen { position: fixed; inset: 0; overflow: hidden; background: #0e151c; }
        .boot-loading-screen__photo { position: absolute; top: calc(50% - 250px); left: calc(50% - 250px); width: 500px; height: 434px; }
        .boot-loading-screen__photo img { position: absolute; top: 0; left: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="root">
        <div class="boot-loading-screen">
            <div class="boot-loading-screen__photo">
                <img src="/src/assets/images/loading/splash_bg.png" alt="" draggable="false" />
                <img src="/src/assets/images/loading/splash_top.png" alt="" draggable="false" />
            </div>
        </div>
    </div>
    <!-- With nginx SSI on for this page ("ssi on; ssi_silent_errors on;"), the boot configuration ships
         inside it instead of costing round trips; without SSI these stay comments and the client fetches
         the files from configuration/. -->
    <script type="application/json" id="volt-boot-client-mode"><!--# include virtual="configuration/client-mode.json" --></script>
    <script type="application/json" id="volt-boot-renderer-config"><!--# include virtual="configuration/renderer-config.json" --></script>
    <script type="application/json" id="volt-boot-ui-config"><!--# include virtual="configuration/ui-config.json" --></script>
    <script type="application/json" id="volt-boot-pets"><!--# include virtual="configuration/pets.json" --></script>
    <!-- {"version": "<sha1>"} of the furnidata the server generates; the client then boots with that exact version. -->
    <script type="application/json" id="volt-boot-furnidata-version"><!--# include virtual="configuration/furnidata-version.json" --></script>
    <!-- {"files": {"ExternalTexts.json": "<version>", ...}}: gamedata the client then requests by version, cacheable until it changes. -->
    <script type="application/json" id="volt-boot-gamedata-versions"><!--# include virtual="configuration/gamedata-versions.json" --></script>
    <script>
    (function () {
        // Start preconnects, WebSocket, and gamedata fetches as soon as HTML arrives while module chunks download.
        var stripComments = function (src) {
            var out = '';
            var inStr = false;
            var esc = false;
            for (var i = 0; i < src.length; i++) {
                var c = src[i];
                var n = src[i + 1];
                if (inStr) {
                    out += c;
                    if (esc) { esc = false; }
                    else if (c === '\\') { esc = true; }
                    else if (c === '"') { inStr = false; }
                    continue;
                }
                if (c === '"') { inStr = true; out += c; continue; }
                if (c === '/' && n === '/') {
                    i += 2;
                    while (i < src.length && src[i] !== '\n' && src[i] !== '\r') i++;
                    i--;
                    continue;
                }
                if (c === '/' && n === '*') {
                    i += 2;
                    while (i < src.length && !(src[i] === '*' && src[i + 1] === '/')) i++;
                    i++;
                    continue;
                }
                if (c === ',') {
                    var j = i + 1;
                    while (j < src.length) {
                        var ch = src[j];
                        if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { j++; continue; }
                        if (ch === '/' && src[j + 1] === '/') {
                            j += 2;
                            while (j < src.length && src[j] !== '\n' && src[j] !== '\r') j++;
                            continue;
                        }
                        if (ch === '/' && src[j + 1] === '*') {
                            j += 2;
                            while (j < src.length && !(src[j] === '*' && src[j + 1] === '/')) j++;
                            j += 2;
                            continue;
                        }
                        break;
                    }
                    if (src[j] === '}' || src[j] === ']') continue;
                }
                out += c;
            }
            return out;
        };
        var readDoc = function (name) {
            var el = document.getElementById('volt-boot-' + name);
            var txt = el && el.textContent ? el.textContent.trim() : '';
            if (!txt || txt.indexOf('<!--') === 0) return null;
            try { return JSON.parse(txt); }
            catch (_) {
                try { return JSON.parse(stripComments(txt)); }
                catch (__) { return null; }
            }
        };
        var parsed = {};
        ['client-mode', 'renderer-config', 'ui-config', 'pets', 'furnidata-version', 'gamedata-versions'].forEach(function (k) {
            parsed[k] = readDoc(k);
        });
        window.__voltBootParsed = parsed;

        var sso = window.__voltLaunchCredentials && window.__voltLaunchCredentials.ssoTicket;
        if (sso === undefined) {
            try {
                var loc = new URL(window.location.href);
                if (loc.searchParams.has('sso')) {
                    sso = loc.searchParams.get('sso') || '';
                    loc.searchParams.delete('sso');
                    window.history.replaceState(window.history.state, '', loc.toString());
                    window.__voltLaunchCredentials = { ssoTicket: sso };
                }
            } catch (_) {}
        }

        // Match secure-assets.ts: only prefetch with plain fetch when client-mode explicitly disables secure assets.
        var mode = window.__voltClientMode || parsed['client-mode'];
        if (!mode || mode.secureAssetsEnabled !== false) return;
        var rc = parsed['renderer-config'];
        if (!rc || typeof rc !== 'object') return;
        var uc = parsed['ui-config'];
        var defs = Object.assign({}, uc && typeof uc === 'object' ? uc : {}, rc);
        var gd = parsed['gamedata-versions'];
        var gdFiles = gd && gd.files && typeof gd.files === 'object' ? gd.files : null;
        var fv = parsed['furnidata-version'];
        var furniVer = fv && typeof fv.version === 'string' && /^[0-9a-f]{8,64}$/i.test(fv.version) ? fv.version : null;

        var interp = function (val) {
            var res = val.replace(/\$\{(.*?)\}/g, function (m, k) {
                return typeof defs[k] === 'string' && defs[k].length ? defs[k] : m;
            });
            if (res.indexOf('%timestamp%') >= 0 && gdFiles) {
                var file = res.split(/[?#]/, 1)[0].split('/').pop();
                var ver = file ? gdFiles[file] : null;
                if (typeof ver === 'string' && ver.length) {
                    res = res.replace(/([?&])t=%timestamp%/i, '$1v=' + encodeURIComponent(ver));
                }
            }
            return res;
        };
        for (var pass = 0; pass < 2; pass++) {
            for (var key in defs) {
                if (typeof defs[key] === 'string' && defs[key].indexOf('${') >= 0) defs[key] = interp(defs[key]);
            }
        }

        var origins = {};
        ['asset.url', 'gamedata.url', 'image.library.url', 'images.url', 'furnidata.url', 'api.url'].forEach(function (k) {
            if (typeof defs[k] !== 'string' || !defs[k]) return;
            try {
                var o = new URL(defs[k], window.location.href).origin;
                if (o && o !== window.location.origin && o.indexOf('http') === 0 && !origins[o]) {
                    origins[o] = 1;
                    var l = document.createElement('link');
                    l.rel = 'preconnect';
                    l.href = o;
                    l.crossOrigin = 'anonymous';
                    document.head.appendChild(l);
                }
            } catch (_) {}
        });

        if (sso && !defs['crypto.ws.enabled'] && typeof defs['socket.url'] === 'string' && /^wss?:\/\//i.test(defs['socket.url'])) {
            try {
                var ws = new WebSocket(defs['socket.url']);
                ws.binaryType = 'arraybuffer';
                var early = { url: defs['socket.url'], socket: ws, opened: false, closed: null, errored: false, messages: [], detach: function () {} };
                var onOpen = function () { early.opened = true; };
                var onClose = function (ev) { early.closed = ev; };
                var onError = function () { early.errored = true; };
                var onMsg = function (ev) { if (ev.data instanceof ArrayBuffer) early.messages.push(ev.data); };
                ws.addEventListener('open', onOpen);
                ws.addEventListener('close', onClose);
                ws.addEventListener('error', onError);
                ws.addEventListener('message', onMsg);
                early.detach = function () {
                    ws.removeEventListener('open', onOpen);
                    ws.removeEventListener('close', onClose);
                    ws.removeEventListener('error', onError);
                    ws.removeEventListener('message', onMsg);
                };
                window.__voltEarlySocket = early;
            } catch (_) {}
        }

        var cache = new Map();
        var dataCache = new Map();
        window.__voltPrefetchCache = cache;
        window.__voltPrefetchData = dataCache;
        var warm = function (u, kind) {
            if (!u || u.indexOf('%timestamp%') >= 0 || u.indexOf('${') >= 0 || u.indexOf('/nitro-sec/') >= 0 || cache.has(u) || dataCache.has(u)) return;
            var k = kind || (/\.(?:hab|nitro)(?:$|[?#])/i.test(u) ? 'bin' : (/\.jsonc?(?:$|[?#])/i.test(u) ? 'json' : 'raw'));
            if (k === 'json') {
                var jp = fetch(u).then(function (r) {
                    var ct = (r.headers && r.headers.get('content-type')) || '';
                    if (r.status !== 200) return { ok: false, status: r.status, contentType: ct, url: r.url || u };
                    // Stream text during module download without blocking DCL/WebSocket auth with synchronous JSON.parse.
                    return r.text().then(function (text) {
                        return { ok: true, status: r.status, contentType: ct, url: r.url || u, text: text };
                    });
                });
                jp.catch(function () { dataCache.delete(u); });
                dataCache.set(u, jp);
                return;
            }
            if (k === 'bin') {
                var bp = fetch(u).then(function (r) {
                    if (!r.ok) return { ok: false, status: r.status, url: r.url || u };
                    return r.arrayBuffer().then(function (buffer) {
                        return { ok: true, status: r.status, url: r.url || u, buffer: buffer };
                    });
                });
                bp.catch(function () { dataCache.delete(u); });
                dataCache.set(u, bp);
                return;
            }
            var p = fetch(u);
            p.catch(function () { cache.delete(u); });
            cache.set(u, p);
        };

        if (typeof defs['furnidata.url'] === 'string') {
            var fu = interp(defs['furnidata.url']);
            if (furniVer) {
                try {
                    var parsedUrl = new URL(fu, window.location.href);
                    parsedUrl.searchParams.delete('t');
                    parsedUrl.searchParams.set('v', furniVer);
                    fu = parsedUrl.toString();
                } catch (_) {}
            }
            warm(fu, 'json');
        }

        ['productdata.url', 'avatar.actions.url', 'avatar.figuredata.url', 'avatar.figuremap.url', 'avatar.effectmap.url'].forEach(function (k) {
            if (typeof defs[k] === 'string') warm(interp(defs[k]), 'json');
        });

        var texts = defs['external.texts.url'];
        if (Array.isArray(texts)) {
            for (var ti = 0; ti < texts.length; ti++) {
                if (typeof texts[ti] !== 'string' || !texts[ti]) break;
                warm(interp(texts[ti]), 'json');
            }
        }

        var preloads = defs['preload.assets.urls'];
        (Array.isArray(preloads) ? preloads : [preloads]).forEach(function (entry) {
            if (typeof entry === 'string' && entry) warm(interp(entry));
        });

        try { warm(new URL('configuration/marketplace-texts.json', document.baseURI).toString(), 'json'); } catch (_) {}

        var fmt = String(defs['asset.bundle.format'] || 'hab').trim().toLowerCase() === 'nitro' ? 'nitro' : 'hab';
        var toFmt = function (u) { return u.replace(/\.(?:hab|nitro)(?=$|[?#])/i, '.' + fmt); };
        if (typeof defs['avatar.asset.url'] === 'string') {
            var tpl = interp(defs['avatar.asset.url']);
            if (tpl.indexOf('%revision%') < 0) {
                var avatarLibs = [];
                try {
                    var saved = JSON.parse(window.localStorage.getItem('volt.boot.mandatoryAvatarLibs') || 'null');
                    if (Array.isArray(saved)) {
                        for (var li = 0; li < saved.length; li++) {
                            if (typeof saved[li] === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(saved[li])) avatarLibs.push(saved[li]);
                        }
                    }
                } catch (_) {}
                if (!avatarLibs.length) avatarLibs = ['hh_human_body', 'hh_human_item'];
                for (var ai = 0; ai < avatarLibs.length; ai++) {
                    warm(toFmt(tpl.replace(/%libname%/gi, avatarLibs[ai])), 'bin');
                }
            }
        }
        if (typeof defs['furni.asset.url'] === 'string') {
            var furniTpl = interp(defs['furni.asset.url']);
            if (furniTpl.indexOf('%revision%') < 0) {
                warm(toFmt(furniTpl.replace(/%libname%/gi, 'landscape')), 'bin');
            }
        }
    })();
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
</body>
</html>
