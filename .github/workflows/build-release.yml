name: Build & Publish Client Release

# Every push to main publishes the built client. The hotel installers download
# volt-client.zip from the latest release, so servers never build it.
# Releases are cut by hand once a batch of changes is ready (Actions > Release > Run workflow).
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact main commit to release (used by upstream sync); empty uses the selected ref.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: client-release
  # Keep queued merges instead of replacing the previous pending release.
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # vite.config.mjs reads the renderer source from ../Volt-Renderer.
      - name: Checkout client
        uses: actions/checkout@v7
        with:
          path: Volt
          ref: ${{ inputs.commit || github.sha }}

      - name: Checkout renderer
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/Volt-Renderer
          ref: main
          path: Volt-Renderer

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: Volt/.nvmrc

      - name: Install dependencies
        run: |
          corepack enable
          (cd Volt-Renderer && corepack yarn install --immutable)
          (cd Volt && corepack yarn install --immutable)

      # A plain Vite build, the same output the live hotel serves.
      - name: Build client
        working-directory: Volt
        run: corepack yarn vite build

      # The installer's update command checks the download against SHA256SUMS.
      - name: Package dist
        run: |
          (cd Volt/dist && zip -qr ../../volt-client.zip .)
          sha256sum volt-client.zip > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Volt
        run: |
          version=$(node -p "require('./package.json').version")
          commit=$(git rev-parse HEAD)
          tag="client-v$version-${commit::7}"
          bash .github/scripts/publish-release.sh "$tag" "Volt client $version (${commit::7})" "$commit" ../volt-client.zip ../SHA256SUMS
